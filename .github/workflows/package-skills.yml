name: Package skill artifact

# The version is read from pyproject.toml on the dispatched ref and is never changed
# here. Bump it on main first (`python scripts/bump_project_version.py minor`), merge,
# then dispatch. Until 2026-08-08 this workflow bumped on the release branch and never
# merged back, so main sat at 0.1.0 while release/skills was at 1.0.0 and local builds
# produced artifacts matching no published tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "skills-v*"

permissions:
  contents: write

jobs:
  package-skills:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: release/skills
    steps:
      - name: Generate release app token
        id: release_app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # release/skills is a publish mirror, not a place where anything is decided: it is
      # reset to the exact dispatched commit. It used to be merged into and bumped here,
      # which is what let it drift to 1.0.0 while main sat at 0.1.0 — and would now
      # conflict in pyproject.toml, since both sides changed the version line.
      - name: Point release branch at the dispatched commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${RELEASE_BRANCH}" == "main" || "${RELEASE_BRANCH}" == "master" ]]; then
            echo "Refusing to release from protected branch ${RELEASE_BRANCH}" >&2
            exit 1
          fi

          git checkout -B "${RELEASE_BRANCH}" "${GITHUB_SHA}"

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="$(python - <<'PY'
          from scripts.build_skill_release import read_project_version
          print(read_project_version())
          PY
          )"
          else
            VERSION="${REF_NAME#skills-v}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=skills-v${VERSION}" >> "${GITHUB_OUTPUT}"

      # Both triggers need dist/release-notes.md, and the changelog may or may not have
      # been cut already: the release ref can carry a finished section for this version
      # (a release prepared on main), or still carry it under [Unreleased]. Handle both,
      # so neither trigger depends on which of the two happened.
      - name: Prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*$.*?(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          ).search(text)

          notes = Path("dist/release-notes.md")
          notes.parent.mkdir(parents=True, exist_ok=True)

          if section:
              notes.write_text(section.group(0).strip() + "\n", encoding="utf-8")
              print(f"reused the existing CHANGELOG section for {version}")
          else:
              subprocess.run(
                  [sys.executable, "scripts/release_changelog.py",
                   "--version", version, "--notes", str(notes)],
                  check=True,
              )
              print(f"cut [Unreleased] into {version}")
          PY

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run skill tests
        run: python -m pytest -q

      - name: Build skill-only release artifact
        run: python scripts/build_skill_release.py --tag "${{ steps.version.outputs.tag }}"

      - name: Validate release artifact rules
        run: python -m pytest skills/tests/test_distribution_package.py -q

      - name: Build single-folder Claude-app bundle
        run: python scripts/build_app_bundle.py

      - name: Validate app bundle rules
        run: python -m pytest skills/tests/test_app_bundle.py -q

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists on origin" >&2
            exit 1
          fi

          # The version and the changelog section are prepared on main before dispatch, so
          # there is normally nothing left to commit here. Only make a commit if the
          # release ref actually differs — an unconditional commit would abort the run.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add pyproject.toml CHANGELOG.md
            git commit -m "chore: release ${TAG_NAME}"
          fi

          git tag "${TAG_NAME}" HEAD
          git push --force origin "HEAD:${RELEASE_BRANCH}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-os-thesis-skills
          path: |
            dist/study-os-thesis-skills-v*.tar.gz
            dist/study-os-thesis-skills-v*.zip
            dist/thesis-finder-app-v*.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ steps.release_app.outputs.token }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: dist/release-notes.md
          files: |
            dist/study-os-thesis-skills-v*.tar.gz
            dist/study-os-thesis-skills-v*.zip
            dist/thesis-finder-app-v*.zip
