name: Package skill artifact

# The version is read from pyproject.toml on the dispatched ref and is never changed
# here. Bump it on main first (`python scripts/bump_project_version.py minor`), merge,
# then dispatch. Until 2026-08-08 this workflow bumped on the release branch and never
# merged back, so main sat at 0.1.0 while release/skills was at 1.0.0 and local builds
# produced artifacts matching no published tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "skills-v*"

permissions:
  contents: write

jobs:
  package-skills:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: release/skills
    steps:
      - name: Generate release app token
        id: release_app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout release branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${RELEASE_BRANCH}" == "main" || "${RELEASE_BRANCH}" == "master" ]]; then
            echo "Refusing to release from protected branch ${RELEASE_BRANCH}" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${RELEASE_BRANCH}"
            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"
          else
            git checkout -B "${RELEASE_BRANCH}"
          fi

          git merge --no-edit "${GITHUB_SHA}"

      - name: Read project version
        if: github.event_name == 'workflow_dispatch'
        id: version
        run: |
          PROJECT_VERSION="$(python - <<'PY'
          from scripts.build_skill_release import read_project_version
          print(read_project_version())
          PY
          )"

          echo "version=${PROJECT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=skills-v${PROJECT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Finalize changelog
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/release_changelog.py --version "${{ steps.version.outputs.version }}" --notes dist/release-notes.md

      # On a tag push the changelog was already finalized on the branch, so there is no
      # [Unreleased] section left to cut. Extract the existing section for this tag
      # instead — without this, dist/release-notes.md does not exist on the tag-push path
      # and "Publish GitHub release" fails on its missing body_path.
      - name: Extract release notes for pushed tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path

          version = os.environ["TAG_NAME"].removeprefix("skills-v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*$.*?(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for version {version}")

          notes = Path("dist/release-notes.md")
          notes.parent.mkdir(parents=True, exist_ok=True)
          notes.write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run skill tests
        run: python -m pytest -q

      - name: Resolve release tag
        id: release
        run: |
          PROJECT_VERSION="$(python - <<'PY'
          from scripts.build_skill_release import read_project_version
          print(read_project_version())
          PY
          )"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ steps.version.outputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build skill-only release artifact
        run: python scripts/build_skill_release.py --tag "${{ steps.release.outputs.tag }}"

      - name: Validate release artifact rules
        run: python -m pytest skills/tests/test_distribution_package.py -q

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists on origin" >&2
            exit 1
          fi
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore: release ${TAG_NAME}"
          git tag "${TAG_NAME}" HEAD
          git push origin "HEAD:${RELEASE_BRANCH}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-os-thesis-skills
          path: |
            dist/study-os-thesis-skills-v*.tar.gz
            dist/study-os-thesis-skills-v*.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ steps.release_app.outputs.token }}
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: dist/release-notes.md
          files: |
            dist/study-os-thesis-skills-v*.tar.gz
            dist/study-os-thesis-skills-v*.zip
